name: Build RPM

on:
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build make automake autoconf gcc git

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate build system
        run: ./autogen.sh

      - name: Create source tarball
        run: make dist

      - name: Build RPM
        run: |
          rpmbuild -ta lbnl-nhc-*.tar.gz \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild"

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: nhc-rpms
          path: rpmbuild/RPMS/noarch/*.rpm

      - name: Upload SRPM
        uses: actions/upload-artifact@v4
        with:
          name: nhc-srpm
          path: rpmbuild/SRPMS/*.rpm
